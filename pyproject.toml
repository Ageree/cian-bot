[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
files = ["sheets.py", "cian_api.py"]
follow_imports = "silent"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["google.oauth2.*", "gspread.*", "playwright_stealth.*"]
ignore_missing_imports = true
